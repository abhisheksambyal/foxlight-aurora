name: Build & deploy

on:
  push:
    branches: [main]
  # Times are UTC. Every 10 min while it can be dark in Oulu (16:00–08:59 Finnish summer time), hourly in daylight.
  # Off the hour because GitHub delays busy slots. GitHub runs schedules late or not at all, so an external timer
  # also triggers workflow_dispatch on the same pattern (see README); overlapping runs are fine (concurrency below).
  schedule:
    - cron: "3-59/10 13-23 * * *"
    - cron: "3-59/10 0-5 * * *"
    - cron: "3 6-12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # "" on foxlight-aurora.github.io, "/foxlight-aurora" on a project page
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
